name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 1. Install System Deps (Updated for Ubuntu 24.04)
    - name: Install Linux System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev xvfb

    # 2. Install Python Deps (Force safe Numpy)
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Force install safe numpy FIRST to prevent conflicts
        pip install "numpy<2.0" 
        pip install -r requirements.txt

    # 3. Run Tests inside Virtual Monitor
    - name: Run Pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # xvfb-run creates a fake screen for the robot to "see"
        xvfb-run -a pytest